# Page descriptions for search results and link previews (GreenTeaPress plans/seo.md).
# prep_notebooks.py writes each one into its notebook's metadata as
# myst.html_meta.description and og:description. index.md and preface.md carry
# theirs in front matter. About 120-155 characters, in the words a reader would search for.

# Chapters
chap01: >-
  Probability and conditional probability in Python, from the Linda problem to
  conjunctions, deriving Bayes's Theorem with a real dataset.
chap02: >-
  Bayes's Theorem in Python: the cookie problem, diachronic Bayes, Bayes tables, the dice
  problem, and the Monty Hall problem.
chap03: >-
  Probability mass functions for Bayesian updates in Python: the cookie problem
  revisited, the 101 bowls problem, and updating dice.
chap04: >-
  Estimating proportions with Bayesian statistics in Python: the Euro problem, the
  binomial distribution and likelihood, and triangle priors.
chap05: >-
  Estimating counts with Bayesian methods in Python: the train problem, power law priors,
  credible intervals, and the German tank problem.
chap06: >-
  Odds and Bayes's Rule, the strength of evidence, and distributions of sums (addends),
  with Oliver's blood and gluten sensitivity examples, in Python.
chap07: >-
  Distributions of minimums, maximums, and mixtures in Python: CDFs, best three of four
  dice, and mixture distributions for making predictions.
chap08: >-
  Poisson processes in Python: the World Cup problem, the gamma distribution, probability
  of superiority, and predicting a rematch.
chap09: >-
  Bayesian decision analysis in Python: The Price Is Right problem, kernel density
  estimation, probability of winning, and maximizing expected gain.
chap10: >-
  Bayesian hypothesis testing in Python: the Euro problem, evidence and Bayes factors,
  and Bayesian bandits that balance explore and exploit.
chap11: >-
  Joint distributions in Python: how tall is A, likelihood and marginal distributions,
  and rating chess players from the outcomes of games.
chap12: >-
  Bayesian classification in Python with Palmer penguin data: normal models, naive Bayes,
  and a less naive classifier with multivariate normal distributions.
chap13: >-
  Bayesian inference versus the t-test: comparing two groups in Python, estimating
  parameters, distributions of differences, and summary statistics.
chap14: >-
  Bayesian survival analysis in Python: the Weibull distribution, incomplete (censored)
  data, light bulb lifetimes, and posterior predictive distributions.
chap15: >-
  Mark and recapture in Python: the grizzly bear problem, the Lincoln index problem, and
  two- and three-parameter models for estimating population size.
chap16: >-
  Bayesian logistic regression in Python: log odds, the Space Shuttle Challenger problem,
  predictive distributions, and empirical Bayes.
chap17: >-
  Bayesian linear regression in Python: is there more snow than there used to be, and
  predicting the marathon world record.
chap18: >-
  Conjugate priors in Python: the World Cup problem revisited, the gamma, beta, and
  Dirichlet distributions, and lions and tigers and bears.
chap19: >-
  The original MCMC chapter of Think Bayes, written with PyMC3, kept for old links. The
  current version of this chapter uses PyMC.
chap19_v3: >-
  MCMC with PyMC: from grid approximation to sampling, prior and posterior predictive
  distributions, the World Cup problem, and regression with happiness data.
chap20: >-
  Approximate Bayesian Computation (ABC) in Python: the kidney tumor problem, growth
  models, simulation, and counting cells.

# Examples
redline: >-
  The Red Line problem: estimating the wait for the next subway train from the number of
  passengers on the platform, with Bayesian decision analysis in Python.
redline_pymc: >-
  The Red Line problem with PyMC: length-biased sampling and five models of the gaps
  between trains, an extension of an exercise from Think Bayes.
vaccine2: >-
  Estimating vaccine efficacy when no one in the vaccinated group got sick: a Bayesian
  answer with the beta distribution, in Python.
usb: >-
  Flipping USB connectors: a Bayesian model of how many tries it takes to plug one in,
  with continuous updates, simulation, and optimization in Python.
sister: >-
  The left-handed sister problem: a Bayesian probability puzzle, solved with successive
  updates and a Bayes factor in Python.
bayes_dice: >-
  Bayesian dice: a simplified version of a problem posed by Thomas Bayes, from Aubrey
  Clayton's Bernoulli's Fallacy, solved in Python.
radiation: >-
  The emitter-detector problem from Jaynes's Probability Theory: modeling a radiation
  sensor with Bayesian updates and a Jeffreys prior, in Python.
hospital: >-
  Grid algorithms for hierarchical models: a Bayesian model of heart attack data with
  more parameters than grids usually handle, compared with PyMC.
hospital_birth_rate: >-
  Comparing birth rates at two hospitals: a Bayesian exercise cut from a draft of Think
  Bayes, solved in Python.
ok: >-
  How many typos are in a book? Estimating the number of errors from what two readers
  find, with simple and three-parameter Bayesian models in Python.
bookstore: >-
  How many books? Using a Bayesian model to infer a bookstore's sales from the copies on
  display, with priors, an update, and optimization in Python.
beta_binomial: >-
  The all-knowing cube of probability: binomial, negative binomial, and beta
  distributions as one 3-D array, and how conjugate priors work.
zipf: >-
  What's a chartist? The chance of hearing a rare word twice in one day, with word
  frequencies, Zipf's law, and a Bayesian update in Python.
bread: >-
  The Poincaré problem: the story of the baker and the underweight bread, a lesson in
  selection bias, with a Bayesian analysis.
cancer: >-
  Why five-year cancer survival rates are misleading, and why they don't show that more
  screening saves lives, with a Markov model and simulation in Python.
raven: >-
  The raven paradox: why a non-black non-raven is evidence that all ravens are black, the
  standard Bayesian response worked out in Python.
frog: >-
  The frog riddle: a probability puzzle from TED-Ed, solved with Bayes's Theorem and
  Poisson models, and what changes when female frogs croak too.
hepatitis: >-
  Tracking a hepatitis outbreak with mark and recapture: Bayesian models with individual
  heterogeneity and sensitivity to priors, in PyMC.
diabetes: >-
  Counting diabetes cases with mark and recapture: estimating how many cases are missing
  from overlapping lists, with Bayesian models in PyMC.
ordinal: >-
  Bayesian ordinal regression for survey answers on an ordered scale, like happiness:
  the forward model, the PyMC model, and what it predicts.
