name: tests

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # https://cron.help/#0_0_1_*_*
    # min hour day-of-month month day-of-week
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # stop testing on macos-latest until they fix the problem
        # installing pytables
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          make tests

  # Chapters 19 and 20 need PyMC, which is not in requirements-dev.txt and
  # requires Python 3.12+. They run in their own job so the matrix above
  # stays light, and so PyTensor is not built on Windows.
  pymc-tests:
    name: PyMC chapters (ubuntu-latest, Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python 3.12
        uses: actions/setup-python@v2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "pymc>=6" "arviz>=1"

      - name: Run tests
        run: |
          cd soln; pytest --nbmake chap19_v3.ipynb chap20.ipynb
